name: Déploiement OVH

# Export statique de lonodji.org (scripts/statique/construire.sh, cible ovh) copié sur l'hébergement OVH.
# Lancement manuel tant que le site est servi par Netlify ; activer le déclencheur « push » au moment de la bascule
# (docs/migration-ovh.md, étape B).
# Deux modes, selon l'offre OVH :
#   - SFTP (offres sans SSH, par exemple Perso) : secrets OVH_HOST (ftp.cluster0XX.hosting.ovh.net), OVH_USER (login
#     FTP de l'hébergement, dont le dossier racine contient www/), OVH_PASSWORD ;
#   - SSH/rsync (Pro et au-dessus) : en plus, OVH_SSH_KEY (clé privée ed25519 enregistrée sur l'hébergement) ; s'il
#     est présent, rsync est utilisé.
# Variable de dépôt OVH_WWW : dossier web relatif à la racine de l'utilisateur (défaut « www ») ; OVH_URL : adresse
# à contrôler (adresse technique avant la bascule, https://lonodji.org après).
on:
  workflow_dispatch:
  # push:
  #   branches: ["main"]

concurrency:
  group: ovh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment: ovh
    env:
      WWW: ${{ vars.OVH_WWW || 'www' }}
      # « true » si une clé SSH est fournie (mode rsync) ; les secrets ne sont pas lisibles dans un « if », d'où cette variable
      SSH: ${{ secrets.OVH_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp rsync > /dev/null
      - name: Clé SSH (mode rsync)
        if: env.SSH == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.OVH_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.OVH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - run: npm ci
      - name: Envois des formulaires (pour les indicateurs)
        env:
          LFTP_PASSWORD: ${{ secrets.OVH_PASSWORD }}
        run: |
          mkdir -p .envois
          if [ "$SSH" = true ]; then
            rsync -az --timeout=30 "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}:lonodji-prive/envois/" .envois/ || echo "pas d'envois rapatriés"
          else
            lftp -u "${{ secrets.OVH_USER }}","$LFTP_PASSWORD" "sftp://${{ secrets.OVH_HOST }}" \
              -e "set sftp:auto-confirm yes; set net:timeout 30; mirror --verbose=0 lonodji-prive/envois .envois; bye" || echo "pas d'envois rapatriés"
          fi
          ENVOIS_DIR=.envois python3 scripts/build-indicateurs.py
      - name: Export statique
        run: CIBLE=ovh bash scripts/statique/construire.sh
      - name: Copie vers OVH
        env:
          LFTP_PASSWORD: ${{ secrets.OVH_PASSWORD }}
        run: |
          if [ "$SSH" = true ]; then
            rsync -az --delete --timeout=60 out/ "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}:$WWW/"
          else
            # miroir SFTP : --delete retire du serveur ce qui n'est plus dans out/ ; --only-newer évite de renvoyer
            # les 450 Mo à chaque fois ; .htaccess et fichiers cachés inclus
            lftp -u "${{ secrets.OVH_USER }}","$LFTP_PASSWORD" "sftp://${{ secrets.OVH_HOST }}" \
              -e "set sftp:auto-confirm yes; set net:timeout 60; set net:max-retries 3; set mirror:parallel-transfer-count 4; \
                  mirror --reverse --delete --only-newer --verbose=1 out $WWW; bye"
          fi
      - name: Recette de l'hébergement
        run: python3 scripts/qa/hebergement.py "${{ vars.OVH_URL || 'https://lonodji.org' }}"
