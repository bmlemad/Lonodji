[build]
  command = "next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# L'ancienne adresse technique renvoie définitivement vers le domaine officiel.
[[redirects]]
  from = "https://adeb-lonodji.netlify.app/*"
  to = "https://lonodji.org/:splat"
  status = 301
  force = true

# Fichiers Next à empreinte : immuables.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Index et données sans empreinte : revalidés à chaque visite (ETag), pour ne jamais contredire la page
# après une mise en ligne ; le service worker les garde déjà pour la lecture hors ligne.
[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/search-palette.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/carte/donnees.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# En-têtes de sécurité aussi pour les fichiers statiques (PDF, images, sw.js, __forms.html),
# que les en-têtes de next.config.mjs ne couvrent pas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.fr; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
